<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Питомник груш №1 | Оптовая продажа саженцев груши в РФ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* Исправление горизонтального скролла на мобильных */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    img, iframe, video {
      max-width: 100%;
      height: auto;
    }

    :root {
      --primary: #122b1c;
      --primary-light: #1f472f;
      --primary-dark: #09170f;
      --accent: #d99b38;
      --accent-bright: #f5b041;
      --accent-hover: #bf8327;
      --bg: #f5f8f5;
      --surface: #ffffff;
      --text: #1d2721;
      --text-muted: #536359;
      --border: #dbe4dc;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-sm: 0 4px 12px rgba(18, 38, 26, 0.05);
      --shadow-md: 0 12px 30px rgba(18, 38, 26, 0.08);
      --shadow-lg: 0 20px 45px rgba(18, 38, 26, 0.14);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Playfair Display', serif;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .shimmer-btn {
      background: linear-gradient(270deg, #d99b38, #f5b041, #f9d976, #f5b041, #d99b38);
      background-size: 300% 300%;
      animation: shimmer 5s ease infinite;
      color: #0b1710 !important;
      border: none !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 20px rgba(217, 155, 56, 0.4);
    }
    .shimmer-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(217, 155, 56, 0.6);
    }

    /* ШАПКА */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(18, 43, 28, 0.1);
      box-shadow: 0 4px 20px rgba(18, 43, 28, 0.06);
    }

    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      gap: 15px;
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--primary);
      flex-shrink: 0;
    }
    .logo img {
      height: 48px;
      width: 48px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .logo-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.15;
      letter-spacing: -0.3px;
    }
    .logo-subtitle {
      font-size: 0.7rem;
      color: var(--accent-hover);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: #2b3a30;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 8px 10px;
      border-radius: 10px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .nav-links a:hover {
      background: rgba(21, 128, 61, 0.1);
      color: var(--primary-light);
      box-shadow: 0 2px 8px rgba(21, 128, 61, 0.08);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--primary);
      padding: 4px;
    }

    .header-contacts {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .phone-card {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 12px;
      background: #f0f6f2;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .phone-card:hover {
      background: #e4efe7;
      border-color: var(--primary-light);
      transform: translateY(-1px);
    }
    .header-phone {
      font-weight: 800;
      color: var(--primary);
      font-size: 1.05rem;
      line-height: 1.15;
    }
    .header-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Адаптивность для шапки под экраны меньше 1200px */
    @media (max-width: 1200px) {
      .mobile-menu-btn { display: block; }
      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        background: #ffffff;
        padding: 20px;
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        border: 1px solid var(--border);
        z-index: 1001;
      }
      .nav-links.active { display: flex; }
      .nav-links a { width: 100%; justify-content: flex-start; padding: 12px 16px; font-size: 0.95rem; }
    }

    /* КНОПКИ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: var(--radius-md);
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
    }
    .btn-accent {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(18, 43, 28, 0.3);
    }
    .btn-accent:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(18, 43, 28, 0.4);
    }
    .btn-outline {
      border: 1.5px solid rgba(18, 43, 28, 0.4);
      color: var(--primary-dark);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: var(--primary);
      color: #fff;
    }
    .btn-secondary:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    /* HERO С УТП-ОФФЕРОМ */
    .hero {
      position: relative;
      background: url('Фон.jpg') center center / cover no-repeat;
      padding: 110px 0 90px;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(245, 248, 245, 0.25) 50%, rgba(255, 255, 255, 0.5) 100%);
      z-index: 1;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .hero-content-box {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      padding: 38px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 40px rgba(18, 43, 28, 0.12);
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(21, 128, 61, 0.12);
      border: 1px solid rgba(21, 128, 61, 0.3);
      color: var(--primary-dark);
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 2.8rem;
      line-height: 1.18;
      margin-bottom: 16px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .hero h1 span {
      color: var(--accent-hover);
      font-style: italic;
    }

    /* УТП ОФФЕР БЛОК */
    .utp-banner {
      background: linear-gradient(135deg, #09170f 0%, #122b1c 100%);
      color: #fff;
      border-left: 4px solid var(--accent-bright);
      padding: 16px 20px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(18, 38, 26, 0.2);
    }
    .utp-banner p {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fefefe;
      line-height: 1.4;
      margin: 0;
    }
    .utp-banner span {
      color: var(--accent-bright);
      text-shadow: 0 0 10px rgba(245, 176, 65, 0.3);
    }

    .hero p.hero-desc {
      font-size: 1.02rem;
      color: #2c4234;
      margin-bottom: 28px;
      line-height: 1.6;
      font-weight: 500;
    }
    .hero-btn-row { display: flex; gap: 16px; flex-wrap: wrap; }

    .hero-stats-panel {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      box-shadow: 0 16px 40px rgba(18, 43, 28, 0.12);
    }
    .stat-card {
      border-left: 3.5px solid var(--accent);
      padding-left: 14px;
    }
    .stat-number {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.35;
      font-weight: 600;
    }

    /* СЕКЦИИ */
    .section-spacing { padding: 90px 0; }
    .section-header {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 50px;
    }
    .section-badge {
      display: inline-block;
      color: var(--accent);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }
    .section-header h2 {
      font-size: 2.4rem;
      color: var(--primary);
      margin-bottom: 14px;
    }
    .section-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* ПРЕИМУЩЕСТВА С ИКОНКАМИ */
    .advantages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }
    .adv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .adv-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: #cbdad0;
    }
    .adv-icon-wrap {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(21, 128, 61, 0.08) 0%, rgba(21, 128, 61, 0.18) 100%);
      color: var(--primary);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      transition: var(--transition);
    }
    .adv-card:hover .adv-icon-wrap {
      background: var(--primary);
      color: var(--accent-bright);
      transform: scale(1.05);
    }
    .adv-icon-wrap svg {
      width: 30px;
      height: 30px;
      stroke-width: 2;
    }
    .adv-card h3 {
      font-size: 1.25rem;
      margin-bottom: 10px;
      color: var(--primary);
    }
    .adv
